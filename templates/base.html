<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ cfg.COMPANY_NAME }} — {{ cfg.COMPANY_DOMAIN }}</title>
  <meta name="description" content="Design • Build • Renovate — Quality renovations across the GTA." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename=cfg.FAVICON_PATH) }}" sizes="32x32">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a href="/" class="brand" aria-label="{{ cfg.COMPANY_NAME }} home">
        <img class="logo" src="{{ url_for('static', filename=cfg.LOGO_PATH) }}" alt="{{ cfg.COMPANY_NAME }} logo" />
        <span class="name">Kingsman Renovations</span>
      </a>
      <nav class="menu">
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        {% if current_user.is_authenticated %}
          {% if current_user.is_admin %}<a href="/admin-portal">Admin</a>{% endif %}
          <a href="/portal">Portal</a>
          <a href="/logout">Log out</a>
        {% else %}
          <a href="/login" class="login-link">Log in</a>
          <a href="/signup" class="login-link">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> {{ cfg.COMPANY_NAME }} · All rights reserved.</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
